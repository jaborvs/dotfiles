monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball.*" } ]
    actions = { update-props = { priority.session = 9999 } }
  }
]

monitor.v4l2.rules = [
  {
    matches = [ { node.name = "v4l2_input.pci-0000_00_14.0-usb-0_5.1.2_1.0" } ]
    actions = { update-props = { priority.session = 9999 } }
  }
]
