#
# @desc Foot config — mirrors Kitty setup
# @auth jaborvs
#

[main]
# Font — matches JetBrainsMono Nerd Font size 10
font=JetBrainsMono Nerd Font:size=10:dpi=96

# Sharper rendering
dpi-aware=no


# Internal padding — matches window_padding_width 10
pad=10x10

# Use xterm-256color for remote compatibility
term=xterm-256color

# Copy selection to clipboard (Ctrl+V) and primary (middle-click) automatically
selection-target=both

[bell]
urgent=no
notify=no

# Foot copies on select by default (matches copy_on_select yes)

[colors]
# Foreground / Background / Cursor
foreground=CECDC3
background=100F0F
cursor=100F0F CECDC3

# URL color when hovering
urls=24837B

# Selection
selection-foreground=100F0F
selection-background=CECDC3

# Normal colors (color0–color7 in Kitty)
regular0=100F0F
regular1=AF3029
regular2=66800B
regular3=AD8301
regular4=205EA6
regular5=A02F6F
regular6=24837B
regular7=CECDC3

# Bright colors (color8–color15 in Kitty)
bright0=575653
bright1=D14D41
bright2=879A39
bright3=D0A215
bright4=4385BE
bright5=CE5D97
bright6=3AA99F
bright7=FFFCF0
