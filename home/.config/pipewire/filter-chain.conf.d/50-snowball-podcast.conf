# Blue Snowball -> "Snowball Podcast" virtual mic (PipeWire filter-chain).
# Loaded by the user service filter-chain.service (pipewire -c filter-chain.conf).
# Apply changes:  systemctl --user restart filter-chain.service
# A/B test:       mic-test
#
# Chain: high-pass -> gate -> EQ (body, mud cut, presence, air) -> compressor -> limiter
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Snowball Podcast"
            media.name       = "Snowball Podcast"
            filter.graph = {
                nodes = [
                    # Rumble, desk knocks and the fan hum below the voice (24 dB/oct).
                    { type = builtin name = hp1 label = bq_highpass control = { "Freq" = 70.0 "Q" = 0.707 } }
                    { type = builtin name = hp2 label = bq_highpass control = { "Freq" = 70.0 "Q" = 0.707 } }
                    # Soft gate: room noise is ~-60 dBFS; attenuate (not mute) below -50 dBFS.
                    { type = ladspa name = gate plugin = ZamGate-ladspa label = ZamGate
                      control = { "Attack" = 5.0 "Release" = 200.0 "Threshold" = -50.0 "Makeup" = 0.0 "Max gate close" = -20.0 } }
                    # Body / "grave": boost around the voice fundamental.
                    { type = builtin name = body label = bq_peaking control = { "Freq" = 150.0 "Q" = 0.8 "Gain" = 4.0 } }
                    # Boxy/muddy room tone typical of condensers in untreated rooms.
                    { type = builtin name = mud label = bq_peaking control = { "Freq" = 350.0 "Q" = 1.0 "Gain" = -3.0 } }
                    # Presence / "crisp": intelligibility band.
                    { type = builtin name = presence label = bq_peaking control = { "Freq" = 4500.0 "Q" = 0.9 "Gain" = 3.0 } }
                    # Air.
                    { type = builtin name = air label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 2.0 } }
                    # Podcast-style levelling.
                    { type = ladspa name = comp plugin = ZamComp-ladspa label = ZamComp
                      control = { "Attack" = 10.0 "Release" = 120.0 "Knee" = 4.0 "Ratio" = 3.5 "Threshold" = -24.0 "Makeup" = 8.0 } }
                    # Safety ceiling so loud bursts never clip.
                    { type = ladspa name = lim plugin = ZaMaximX2-ladspa label = ZaMaximX2
                      control = { "Release" = 25.0 "Output Ceiling" = -1.0 "Threshold" = 0.0 } }
                ]
                links = [
                    { output = "hp1:Out"            input = "hp2:In" }
                    { output = "hp2:Out"            input = "gate:Audio Input 1" }
                    { output = "gate:Audio Output 1" input = "body:In" }
                    { output = "body:Out"           input = "mud:In" }
                    { output = "mud:Out"            input = "presence:In" }
                    { output = "presence:Out"       input = "air:In" }
                    { output = "air:Out"            input = "comp:Audio Input 1" }
                    { output = "comp:Audio Output 1" input = "lim:Audio Input 1" }
                ]
                inputs  = [ "hp1:In" ]
                outputs = [ "lim:Audio Output 1" ]
            }
            capture.props = {
                node.name      = "snowball_podcast.capture"
                node.description = "Snowball Podcast (capture)"
                target.object  = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_797_2019_11_12_10744-00.pro-input-0"
                audio.channels = 1
                audio.position = [ AUX0 ]
                node.passive   = true
                stream.dont-remix = true
            }
            playback.props = {
                node.name        = "snowball_podcast"
                node.description = "Snowball Podcast"
                media.class      = Audio/Source
                audio.channels   = 1
                audio.position   = [ MONO ]
                priority.session = 10000
            }
        }
    }
]
